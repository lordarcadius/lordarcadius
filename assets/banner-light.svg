<g class="f0" style="opacity:1"><text x="56" y="262" font-size="36" fill="#0E8F4E" font-weight="400">&gt;</text><text class="t0" x="99.2" y="262" font-size="36" fill="#0B1020" font-weight="400" xml:space="preserve">Android Developer</text><g class="c0" style="transform:translateX(367.2px)"><rect class="blink" x="99.2" y="234" width="11.88" height="36" rx="2" fill="#0E8F4E"/></g></g>
