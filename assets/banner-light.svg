<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
<title id="t">Vipul Jha</title>
<desc id="d">Terminal-style banner: adb shell whoami prints Vipul Jha, followed by a cycling line of roles: Android Developer, Jetpack Compose, Kotlin, Java, AOSP, Chromium &amp; kernels, Primebook, Delhi, India.</desc>
<defs>
<style>@font-face{font-family:'JBM';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-style:normal;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.blink{animation:none}.t0,.t1,.t2,.t3{clip-path:inset(0 0 0 0)}@media (prefers-reduced-motion:no-preference){@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.05s steps(1,end) infinite}@keyframes f0{0%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}@keyframes t0{0%{clip-path:inset(0 100% 0 0)}0%{clip-path:inset(0 100% 0 0)}8.5%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}@keyframes c0{0%{transform:translateX(0)}0%{transform:translateX(0)}8.5%{transform:translateX(367.2px)}100%{transform:translateX(367.2px)}}.f0{animation:f0 16s linear infinite}.t0{animation:t0 16s steps(17,end) infinite}.c0{animation:c0 16s steps(17,end) infinite}@keyframes f1{0%{opacity:0}25%{opacity:0}25.01%{opacity:1}47%{opacity:1}50%{opacity:0}100%{opacity:0}}@keyframes t1{0%{clip-path:inset(0 100% 0 0)}25%{clip-path:inset(0 100% 0 0)}33.5%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}@keyframes c1{0%{transform:translateX(0)}25%{transform:translateX(0)}33.5%{transform:translateX(626.4px)}100%{transform:translateX(626.4px)}}.f1{animation:f1 16s linear infinite}.t1{animation:t1 16s steps(29,end) infinite}.c1{animation:c1 16s steps(29,end) infinite}@keyframes f2{0%{opacity:0}50%{opacity:0}50.01%{opacity:1}72%{opacity:1}75%{opacity:0}100%{opacity:0}}@keyframes t2{0%{clip-path:inset(0 100% 0 0)}50%{clip-path:inset(0 100% 0 0)}58.5%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}@keyframes c2{0%{transform:translateX(0)}50%{transform:translateX(0)}58.5%{transform:translateX(518.4px)}100%{transform:translateX(518.4px)}}.f2{animation:f2 16s linear infinite}.t2{animation:t2 16s steps(24,end) infinite}.c2{animation:c2 16s steps(24,end) infinite}@keyframes f3{0%{opacity:0}75%{opacity:0}75.01%{opacity:1}97%{opacity:1}100%{opacity:0}100%{opacity:0}}@keyframes t3{0%{clip-path:inset(0 100% 0 0)}75%{clip-path:inset(0 100% 0 0)}83.5%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}@keyframes c3{0%{transform:translateX(0)}75%{transform:translateX(0)}83.5%{transform:translateX(496.8px)}100%{transform:translateX(496.8px)}}.f3{animation:f3 16s linear infinite}.t3{animation:t3 16s steps(23,end) infinite}.c3{animation:c3 16s steps(23,end) infinite}}</style>
